services:

  database:
    image: pgvector/pgvector:pg16
    container_name: ms-chatbot-database
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - chatbot_db_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - woridge-external-network

  ollama:
    image: ollama/ollama
    container_name: ms-chatbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - woridge-external-network

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: ms-chatbot
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: rag-redis
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      OLLAMA_URL: http://ollama:11434
      CLASSIFIER_URL: http://ms-classifier:5000
    ports:
      - "${SERVER_PORT}:8080"
    restart: always
    depends_on:
      database:
        condition: service_healthy
      ms-classifier:
        condition: service_started
    networks:
      - woridge-external-network

  ms-classifier:
    build:
      context: ../ms-classifier
      dockerfile: Dockerfile
    container_name: ms-classifier
    ports:
      - "5000:5000"
    volumes:
      - ../ms-classifier/model:/app/model
    restart: always
    networks:
      - woridge-external-network

volumes:
  chatbot_db_data:
  ollama_data:

networks:
  woridge-external-network:
    external: true