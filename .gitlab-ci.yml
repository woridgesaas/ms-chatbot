stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 15 minutes

